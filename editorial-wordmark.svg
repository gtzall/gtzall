<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">GTZALL editorial terminal wordmark</title>
  <desc id="desc">Minimal terminal wordmark with ruled-paper texture and cursor</desc>
  <defs>
    <pattern id="rules" width="1200" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 27.5H1200" stroke="#263029" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="8" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="screen"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="14" fill="#0c100e"/>
  <rect x="18" y="18" width="1164" height="224" rx="8" fill="url(#rules)" opacity=".72"/>
  <path d="M42 52H1158" stroke="#c9a75b" stroke-width="1" opacity=".7"/>
  <text x="48" y="43" font-family="monospace" font-size="13" fill="#8da58d">gtzall / readme / 001</text>
  <text x="1152" y="43" text-anchor="end" font-family="monospace" font-size="13" fill="#8da58d">[ online ]</text>
  <text x="52" y="151" font-family="Georgia, serif" font-size="104" letter-spacing="10" fill="#d7e4d2" filter="url(#soft)">GTZALL</text>
  <path d="M58 177 C250 184, 480 169, 690 178 S1000 171, 1140 178" fill="none" stroke="#8cc084" stroke-width="2"/>
  <text x="58" y="214" font-family="monospace" font-size="15" fill="#c9a75b">web developer</text>
  <text x="1142" y="214" text-anchor="end" font-family="monospace" font-size="15" fill="#8da58d">interfaces / code / intent</text>
  <rect x="252" y="199" width="9" height="20" fill="#8cc084"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
